version: 2

models:
  - name: dq_daily_health
    description: >
      Indicadores diarios de calidad del tracking sobre stg_ga4__events.
      Solo mide; los umbrales están en los tests (carpeta tests/).
    columns:
      - name: event_date
        data_tests: [unique, not_null]
      - name: events
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: events_with_pii_in_url
        description: Eventos con un correo (en claro o como %40) o un parámetro de correo en page_location / page_referrer.
      - name: duplicate_purchase_events
        description: Eventos purchase repetidos para una misma transaction_id válida.
      - name: purchases_without_value
        description: Compras con transaction_id válido y valor nulo o menor o igual que cero.
      - name: volume_ratio
        description: Eventos del día entre la media de los 7 días anteriores. Nulo en el primer día de la serie.

unit_tests:
  - name: dq_daily_health_cuenta_pii_duplicados_y_compras_sin_valor
    model: dq_daily_health
    given:
      - input: ref('stg_ga4__events')
        rows:
          # día 1: dos vistas con correo en la URL (en claro y como %40), una compra duplicada,
          # una compra sin valor y una compra sin transaction_id válido
          - {event_date: 2021-01-01, event_name: page_view, session_key: 'u1-1', page_location: 'https://shop.test/gracias?email=ana@example.com'}
          - {event_date: 2021-01-01, event_name: page_view, session_key: 'u2-1', page_location: 'https://shop.test/p?x=bob%40example.org'}
          - {event_date: 2021-01-01, event_name: purchase, session_key: 'u1-1', transaction_id: 'T1', purchase_revenue_usd: 10.0}
          - {event_date: 2021-01-01, event_name: purchase, session_key: 'u1-1', transaction_id: 'T1', purchase_revenue_usd: 10.0}
          - {event_date: 2021-01-01, event_name: purchase, session_key: 'u2-1', transaction_id: 'T2', purchase_revenue_usd: 0.0}
          - {event_date: 2021-01-01, event_name: purchase, session_key: 'u2-1', transaction_id: '(not set)', purchase_revenue_usd: 5.0}
          # día 2: un evento limpio y sin sesión
          - {event_date: 2021-01-02, event_name: page_view, page_location: 'https://shop.test/'}
    expect:
      rows:
        - {event_date: 2021-01-01, events: 6, page_views: 2, sessions: 2, events_without_session: 0, events_with_pii_in_url: 2, purchase_events: 4, distinct_transactions: 2, purchases_without_transaction_id: 1, purchases_without_value: 1, duplicate_purchase_events: 1}
        - {event_date: 2021-01-02, events: 1, page_views: 1, sessions: 0, events_without_session: 1, events_with_pii_in_url: 0, purchase_events: 0, distinct_transactions: 0, purchases_without_transaction_id: 0, purchases_without_value: 0, duplicate_purchase_events: 0}

  - name: dq_daily_health_razon_de_volumen_contra_los_7_dias_previos
    model: dq_daily_health
    given:
      - input: ref('stg_ga4__events')
        rows:
          - {event_date: 2021-01-01, event_name: page_view, session_key: 'a-1'}
          - {event_date: 2021-01-01, event_name: page_view, session_key: 'a-1'}
          - {event_date: 2021-01-02, event_name: page_view, session_key: 'b-1'}
          - {event_date: 2021-01-02, event_name: page_view, session_key: 'b-1'}
          - {event_date: 2021-01-03, event_name: page_view, session_key: 'c-1'}
    expect:
      rows:
        - {event_date: 2021-01-01, events: 2, events_prev_7d_avg: null, volume_ratio: null}
        - {event_date: 2021-01-02, events: 2, events_prev_7d_avg: 2.0, volume_ratio: 1.0}
        - {event_date: 2021-01-03, events: 1, events_prev_7d_avg: 2.0, volume_ratio: 0.5}
